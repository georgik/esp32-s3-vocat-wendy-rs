[package]
name = "esp32-vocat-wendy-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Empty workspace to avoid being part of the parent workspace
[workspace]
members = ["wendy", "imgdecode"]

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
# The console is the USB-Serial-JTAG on the USB-C port: UART0 TX (GPIO43)
# drives the green LED on the ESP-VoCat, so never print to UART.
esp-println = { version = "0.18.0", default-features = false, features = [
    "colors",
    "critical-section",
    "esp32s3",
    "jtag-serial",
    "log-04",
] }
log = "0.4.27"

# Pure-Rust, no_std decoders for the raw-RGB565 image chunks sent over the
# network (hex / base64, chunk-boundary invariant). Host-testable, so it carries
# no esp-hal or display dependencies.
imgdecode = { version = "0.1.0", path = "imgdecode" }
# Baseline-JPEG decoder for the live sensor stream. MIT/Apache-2.0 (the official
libjpeg-turbo-rs = { version = "0.9", default-features = false }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }

# Wi-Fi station + embassy-net/smoltcp stack. Versions pinned to match the
# esp-vocat examples, which are proven to build
# and run on this ESP32-S3 board.

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "multicast",
  "proto-ipv4",
  "tcp",
  "udp",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
embedded-io-async = "0.7.0"
static_cell = "2.1.1"
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }

embedded-graphics = "0.8"
bevy_ecs = { version = "0.18.1", default-features = false }
heapless = "0.9.2"
# const-constructible mutex backing the shared latest-message store.
embassy-sync = "0.6.2"


# Board support: the round 360×360 ST77916 LCD on the ESP-VoCat v1.2.
esp-vocat = { git = "https://github.com/Hahihula/esp-vocat-rust-examples", tag = "v0.1.0" }
wendy = { version = "0.1.0", path = "wendy" }

# no_std TLS backend for the LAN Wendy link.
# `mbedtls-rs` wraps MbedTLS 3.x. We reuse its prebuilt
# `xtensa-esp32s3` libraries/bindings (full `tls` bundle + `DEFAULT_HOOKS`),
# which fall back to *software* crypto when no hardware accelerator is hooked,
# so no `EspAccel` setup is required. `esp32s3` selects the esp-hal hook
# backend surface; `log` routes MbedTLS's debug traces through the `log` crate.
# We deliberately do NOT enable `hook-timer`/`hook-wall-clock` — those would
# force an on-the-fly rebuild of the C MbedTLS from source, which we don't need
# since the built-in software timer/clock is sufficient.
mbedtls-rs = { version = "0.3", features = ["log", "esp32s3"] }

[features]
default = ["esp-hal/esp32s3", "esp-backtrace/esp32s3", "esp-println/esp32s3"]
